# 每次 push/PR 自动跑主闸门：web/selftest.py（190+ 项）+ 契约/静态探针。
# 步骤与 Devin 环境蓝图（initialize 段）同源：装依赖 → 重建 corpus.db →
# knowledge.db 种子 → 离线跑 selftest。新增依赖时两处同步改。
name: selftest
on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # lfs: true — bge-small-zh 模型权重（model.safetensors/pytorch_model.bin）
      # 在 LFS 里；不拉的话 bazi.semantic 会拿指针文件当权重读，直接挂。
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: 依赖
        run: |
          pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
      - name: 构建语料索引（data/index/corpus.db，gitignored）
        run: |
          python scripts/check_quality.py
          python scripts/build_index.py
      - name: knowledge.db 种子（selftest threads.detail/share.bazi 需要 id=1）
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          sys.path.insert(0, 'src')
          from guji.knowledge import KnowledgeBase, Evidence
          kb = KnowledgeBase('data/index/knowledge.db')
          if kb.db.execute("SELECT count(*) c FROM thread").fetchone()["c"] == 0:
              tid = kb.open_thread('env-seed: CI 种子线程')
              kb.add_turn(tid, 'user', 'CI 自检种子')
          else:
              tid = kb.db.execute("SELECT id FROM thread ORDER BY id LIMIT 1").fetchone()["id"]
          if kb.db.execute("SELECT count(*) c FROM derived").fetchone()["c"] == 0:
              kb.record('summary', '天下之至柔，驰骋于天下之至坚', 'env-seed',
                        evidence=[Evidence(work_id='KR5c0057', file='KR5c0057_043.txt',
                                           raw_start=6918, raw_end=6994,
                                           quote='第四十三章 天下之至柔',
                                           page_anchor='KR5c0057_tls_043-1a')],
                        thread_id=tid)
          kb.close()
          PY
      - name: 主闸门 selftest
        env:
          BOOKS_LLM_DISABLE: "1"
        run: python web/selftest.py
      - name: 契约探针
        env:
          BOOKS_LLM_DISABLE: "1"
        run: python probes/probe_contract.py
      - name: 断言回归闸 probe_selftest_regress（断言集只增不减）
        env:
          BOOKS_LLM_DISABLE: "1"
        run: python probes/probe_selftest_regress.py
      - name: 专业模式字节冻结闸 baseline_voice（判据 9）
        env:
          BOOKS_LLM_DISABLE: "1"
        run: python web/baseline_voice.py
      - name: LLM 层闸门 probe_llm_polish（specs/006 判据 2/2b/3/6/7/8）
        env:
          BOOKS_LLM_DISABLE: "1"
        run: python probes/probe_llm_polish.py
      - name: $ 误用静态探针
        run: python probes/probe_dollar_misuse.py
      - name: corpus 数据闸门（章节/双引擎/出处/索引/G1-G9）
        run: |
          python scripts/check_booksec.py
          python scripts/check_dual_engine.py
          python scripts/check_provenance.py
          python scripts/verify_index.py
          python scripts/assess_goals.py

  # 浏览器闸门：DOM 渲染层回归（selftest 只到 API 层）。独立 job 免得拖慢主闸。
  browser-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: 依赖（含 playwright + chromium）
        run: |
          pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: 构建语料索引 + knowledge 种子（与 selftest job 同步骤）
        run: |
          python scripts/check_quality.py
          python scripts/build_index.py
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          sys.path.insert(0, 'src')
          from guji.knowledge import KnowledgeBase, Evidence
          kb = KnowledgeBase('data/index/knowledge.db')
          if kb.db.execute("SELECT count(*) c FROM thread").fetchone()["c"] == 0:
              tid = kb.open_thread('env-seed: CI 种子线程')
              kb.add_turn(tid, 'user', 'CI 自检种子')
          else:
              tid = kb.db.execute("SELECT id FROM thread ORDER BY id LIMIT 1").fetchone()["id"]
          if kb.db.execute("SELECT count(*) c FROM derived").fetchone()["c"] == 0:
              kb.record('summary', '天下之至柔，驰骋于天下之至坚', 'env-seed',
                        evidence=[Evidence(work_id='KR5c0057', file='KR5c0057_043.txt',
                                           raw_start=6918, raw_end=6994,
                                           quote='第四十三章 天下之至柔',
                                           page_anchor='KR5c0057_tls_043-1a')],
                        thread_id=tid)
          kb.close()
          PY
      - name: 首屏闸门 probe_first_screen
        env:
          BOOKS_LLM_DISABLE: "1"
        run: python probes/probe_first_screen.py
      - name: UI 冒烟 probe_ui_smoke
        env:
          BOOKS_LLM_DISABLE: "1"
        run: python probes/probe_ui_smoke.py
      - name: 日期词前后端一致性 probe_date_parity
        env:
          BOOKS_LLM_DISABLE: "1"
        run: python probes/probe_date_parity.py
